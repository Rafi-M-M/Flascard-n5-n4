<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanji – Pilih Deck</title>
    <style>
        /* Reset & Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f2f6fc;
            color: #1e293b;
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .app {
            max-width: 820px;
            width: 100%;
            background: white;
            border-radius: 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 28px 24px 36px;
            transition: all 0.2s;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 4px;
            color: #0f172a;
        }
        h1 small {
            font-size: 15px;
            font-weight: 400;
            color: #64748b;
        }
        .subtitle {
            color: #475569;
            font-size: 14px;
            border-left: 4px solid #3b82f6;
            padding-left: 14px;
            margin-bottom: 22px;
            line-height: 1.5;
        }
        /* --- Deck Pilihan --- */
        .deck-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin: 20px 0 10px;
        }
        .deck-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            padding: 24px 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .deck-card:hover {
            border-color: #94a3b8;
            background: #f1f5f9;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        .deck-card .deck-number {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
        }
        .deck-card .deck-count {
            font-size: 15px;
            color: #64748b;
            margin-top: 4px;
        }
        .deck-card .deck-emoji {
            font-size: 32px;
            display: block;
            margin-bottom: 4px;
        }
        /* --- Mode toggle (di dalam deck) --- */
        .mode-toggle {
            display: flex;
            gap: 12px;
            margin: 16px 0 20px;
            flex-wrap: wrap;
        }
        .mode-btn {
            padding: 8px 22px;
            border-radius: 40px;
            border: 2px solid #e2e8f0;
            background: white;
            font-weight: 600;
            font-size: 14px;
            color: #475569;
            cursor: pointer;
            transition: 0.2s;
        }
        .mode-btn:hover {
            border-color: #94a3b8;
        }
        .mode-btn.active {
            border-color: #3b82f6;
            background: #eff6ff;
            color: #1d4ed8;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 12px;
            padding: 6px 18px;
            border-radius: 40px;
            border: none;
            background: #e2e8f0;
            font-weight: 600;
            font-size: 14px;
            color: #1e293b;
            cursor: pointer;
            transition: 0.2s;
        }
        .back-btn:hover {
            background: #cbd5e1;
        }
        /* Flashcard */
        .card-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
        }
        .card-container {
            perspective: 1200px;
            width: 100%;
            max-width: 480px;
            min-height: 320px;
            cursor: pointer;
            margin: 0 auto;
        }
        .card-flipper {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 320px;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
        }
        .card-flipper.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            min-height: 320px;
            backface-visibility: hidden;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            background: white;
            border: 1px solid #edf2f7;
        }
        .card-face.front {
            background: linear-gradient(145deg, #ffffff, #f9fcff);
        }
        .card-face.back {
            transform: rotateY(180deg);
            background: linear-gradient(145deg, #f9fcff, #ffffff);
        }
        .card-face .kanji-big {
            font-size: 76px;
            font-weight: 700;
            line-height: 1.2;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .card-face .reading {
            font-size: 26px;
            color: #475569;
            letter-spacing: 1px;
        }
        .card-face .meaning {
            font-size: 30px;
            font-weight: 600;
            color: #1e293b;
            margin-top: 2px;
        }
        .card-face .label {
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 12px;
        }
        .card-face .counter {
            position: absolute;
            bottom: 16px;
            right: 22px;
            font-size: 14px;
            color: #94a3b8;
            font-weight: 500;
        }
        .card-face .hint {
            position: absolute;
            bottom: 16px;
            left: 22px;
            font-size: 13px;
            color: #94a3b8;
        }
        .card-nav {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .card-nav button {
            padding: 8px 20px;
            border-radius: 40px;
            border: none;
            background: #f1f5f9;
            font-weight: 600;
            font-size: 14px;
            color: #1e293b;
            cursor: pointer;
            transition: 0.2s;
        }
        .card-nav button:hover:not(:disabled) {
            background: #e2e8f0;
        }
        .card-nav button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .card-nav .page-info {
            font-weight: 600;
            color: #475569;
            min-width: 70px;
            text-align: center;
            font-size: 14px;
        }
        /* Quiz */
        .quiz-area {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }
        .quiz-sub-mode {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .quiz-sub-mode button {
            padding: 8px 20px;
            border-radius: 40px;
            border: 2px solid #e2e8f0;
            background: white;
            font-weight: 600;
            font-size: 14px;
            color: #475569;
            cursor: pointer;
            transition: 0.2s;
        }
        .quiz-sub-mode button:hover {
            border-color: #94a3b8;
        }
        .quiz-sub-mode button.active {
            border-color: #3b82f6;
            background: #eff6ff;
            color: #1d4ed8;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }
        .quiz-header .score {
            font-weight: 700;
            font-size: 17px;
            color: #0f172a;
            background: #f1f5f9;
            padding: 4px 18px;
            border-radius: 40px;
        }
        .quiz-header .progress-text {
            color: #64748b;
            font-size: 15px;
        }
        .quiz-question {
            background: #f8fafc;
            border-radius: 20px;
            padding: 24px 20px;
            border: 1px solid #e9edf2;
            margin-bottom: 18px;
            text-align: center;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }
        .quiz-question .q-kanji {
            font-size: 52px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.2;
        }
        .quiz-question .q-furigana {
            font-size: 20px;
            color: #3b82f6;
            font-weight: 500;
            min-height: 2em;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .quiz-question .q-furigana.show {
            opacity: 1;
        }
        .quiz-question .q-prompt {
            font-size: 15px;
            color: #64748b;
            margin-top: 6px;
        }
        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 6px;
        }
        .quiz-options button {
            padding: 14px 12px;
            border-radius: 16px;
            border: 2px solid #e2e8f0;
            background: white;
            font-size: 16px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            word-break: break-word;
        }
        .quiz-options button:hover:not(:disabled) {
            border-color: #94a3b8;
            background: #f8fafc;
        }
        .quiz-options button.correct {
            border-color: #22c55e;
            background: #dcfce7;
            color: #166534;
        }
        .quiz-options button.wrong {
            border-color: #ef4444;
            background: #fee2e2;
            color: #991b1b;
        }
        .quiz-options button:disabled {
            cursor: default;
            opacity: 0.7;
        }
        .quiz-options button.reveal-correct {
            border-color: #22c55e;
            background: #dcfce7;
        }
        .quiz-next-btn {
            margin-top: 18px;
            padding: 14px 20px;
            border-radius: 40px;
            border: none;
            background: #1e293b;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .quiz-next-btn:hover:not(:disabled) {
            background: #0f172a;
        }
        .quiz-next-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .quiz-done {
            text-align: center;
            padding: 30px 20px;
            background: #f1f5f9;
            border-radius: 20px;
        }
        .quiz-done h3 {
            font-size: 22px;
            margin-bottom: 6px;
        }
        .quiz-done .final-score {
            font-size: 44px;
            font-weight: 700;
            color: #0f172a;
        }
        .quiz-done button {
            margin-top: 16px;
            padding: 12px 32px;
            border-radius: 40px;
            border: none;
            background: #3b82f6;
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }
        .quiz-done button:hover {
            background: #2563eb;
        }
        /* Sembunyikan konten deck saat di halaman pilihan */
        .deck-content {
            display: none;
        }
        .deck-content.active {
            display: block;
        }
        .deck-picker {
            display: block;
        }
        .deck-picker.hidden {
            display: none;
        }
        /* Responsive */
        @media (max-width: 640px) {
            .app {
                padding: 18px 14px 28px;
                border-radius: 24px;
            }
            h1 {
                font-size: 22px;
            }
            .deck-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 12px;
            }
            .deck-card {
                padding: 18px 8px;
            }
            .deck-card .deck-number {
                font-size: 22px;
            }
            .card-container {
                min-height: 260px;
            }
            .card-flipper {
                min-height: 260px;
            }
            .card-face {
                min-height: 260px;
                padding: 20px 16px;
            }
            .card-face .kanji-big {
                font-size: 56px;
            }
            .card-face .meaning {
                font-size: 24px;
            }
            .card-face .reading {
                font-size: 22px;
            }
            .quiz-options {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .quiz-question {
                padding: 20px 16px;
                min-height: 120px;
            }
            .quiz-question .q-kanji {
                font-size: 44px;
            }
            .mode-btn {
                padding: 6px 16px;
                font-size: 13px;
            }
            .quiz-sub-mode button {
                padding: 6px 16px;
                font-size: 13px;
            }
        }
        @media (max-width: 400px) {
            .card-face .kanji-big {
                font-size: 42px;
            }
            .card-face .meaning {
                font-size: 20px;
            }
            .card-nav button {
                padding: 6px 14px;
                font-size: 13px;
            }
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="app" id="app">
    <header>
        <h1>📚 Kanji <small>613 漢字 · 6 Deck</small></h1>
        <div class="subtitle">Pilih deck, lalu pilih mode Flashcard atau Latihan</div>
    </header>

    <!-- Pilihan Deck -->
    <div id="deckPicker" class="deck-picker">
        <div class="deck-grid" id="deckGrid"></div>
    </div>

    <!-- Konten Deck (akan ditampilkan setelah memilih deck) -->
    <div id="deckContent" class="deck-content">
        <button class="back-btn" id="backToPicker">← Kembali ke Pilihan Deck</button>
        <div class="mode-toggle" id="modeToggle">
            <button class="mode-btn active" data-mode="flashcard">🃏 Flashcard</button>
            <button class="mode-btn" data-mode="quiz">📝 Latihan Soal</button>
        </div>

        <div id="flashcardSection">
            <div class="card-area">
                <div class="card-container" id="cardContainer">
                    <div class="card-flipper" id="cardFlipper">
                        <div class="card-face front">
                            <div class="kanji-big" id="frontKanji">魚</div>
                            <div class="label">Klik untuk balik</div>
                            <div class="counter" id="frontCounter">1 / 100</div>
                        </div>
                        <div class="card-face back">

                            <div class="label">← Klik untuk balik</div>
                            <div class="counter" id="backCounter">1 / 100</div>
                            <div class="hint" id="backHint">#1</div>
                        </div>
                    </div>
                </div>
                <div class="card-nav">
                    <button id="prevCard">◀ Sebelum</button>
                    <span class="page-info" id="pageInfo">1 / 100</span>
                    <button id="nextCard">Selanjutnya ▶</button>
                    <button id="shuffleBtn" style="background:#e2e8f0;">🔀 Acak Deck</button>
                </div>
            </div>
        </div>

        <div id="quizSection" style="display:none;">
            <div class="quiz-area" id="quizArea">
                <div class="quiz-sub-mode" id="quizSubMode">
                    <button class="active" data-sub="1">📖 Kanji → Arti</button>
                    <button data-sub="2">✍️ Arti → Kanji</button>
                </div>
                <div class="quiz-header">
                    <span class="progress-text" id="quizProgress">Soal 1 / 100</span>
                    <span class="score" id="quizScore">✅ 0</span>
                </div>
                <div id="quizBody"></div>
            </div>
        </div>
    </div>
</div>

        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function chunk(arr, size) {
        const result = [];
        for (let i = 0; i < arr.length; i += size) {
            result.push(arr.slice(i, i + size));
        }
        return result;
    }

    // ── 6 deck, urut PDF ──
    const allData = RAW_DATA.filter(d => d.id !== undefined);
    const TOTAL_DECKS = 6;
    const deckSize = Math.ceil(allData.length / TOTAL_DECKS);
    const rawDecks = chunk(allData, deckSize);
    while (rawDecks.length < TOTAL_DECKS) rawDecks.push([]);
    const decks = rawDecks.map(d => [...d]);

    // ── State ──
    let currentDeck = 0;
    let currentCard = 0;
    let isFlipped = false;
    let quizSubMode = 1; // 1: Kanji→Arti, 2: Arti→Kanji

    // ── DOM ──
    const deckPicker = document.getElementById('deckPicker');
    const deckGrid = document.getElementById('deckGrid');
    const deckContent = document.getElementById('deckContent');
    const backBtn = document.getElementById('backToPicker');

    const flipper = document.getElementById('cardFlipper');
    const frontKanji = document.getElementById('frontKanji');
    const frontCounter = document.getElementById('frontCounter');
    const backReading = document.getElementById('backReading');
    const backMeaning = document.getElementById('backMeaning');
    const backCounter = document.getElementById('backCounter');
    const backHint = document.getElementById('backHint');
    const pageInfo = document.getElementById('pageInfo');
    const prevBtn = document.getElementById('prevCard');
    const nextBtn = document.getElementById('nextCard');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const flashcardSection = document.getElementById('flashcardSection');
    const quizSection = document.getElementById('quizSection');
    const quizBody = document.getElementById('quizBody');
    const quizProgress = document.getElementById('quizProgress');
    const quizScoreEl = document.getElementById('quizScore');
    const modeBtns = document.querySelectorAll('#modeToggle .mode-btn');
    const cardContainer = document.getElementById('cardContainer');
    const quizSubModeContainer = document.getElementById('quizSubMode');

    // ═══════════════════════════════════════════════════════════════
    //  DECK PICKER
    // ═══════════════════════════════════════════════════════════════
    function renderDeckPicker() {
        deckGrid.innerHTML = '';
        decks.forEach((deck, i) => {
            const count = deck.length;
            const card = document.createElement('div');
            card.className = 'deck-card';
            card.innerHTML = `
                <span class="deck-emoji">📘</span>
                <div class="deck-number">Deck ${i+1}</div>
                <div class="deck-count">${count} kanji</div>
            `;
            card.addEventListener('click', () => {
                currentDeck = i;
                currentCard = 0;
                isFlipped = false;
                flipper.classList.remove('flipped');
                showDeckContent();
            });
            deckGrid.appendChild(card);
        });
    }

    function showDeckContent() {
        deckPicker.classList.add('hidden');
        deckContent.classList.add('active');
        // reset mode ke flashcard
        document.querySelector('#modeToggle .mode-btn[data-mode="flashcard"]').click();
        renderCard();
        initQuiz();
    }

    function showDeckPicker() {
        deckPicker.classList.remove('hidden');
        deckContent.classList.remove('active');
    }

    backBtn.addEventListener('click', showDeckPicker);

    // ═══════════════════════════════════════════════════════════════
    //  FLASHCARD
    // ═══════════════════════════════════════════════════════════════
    function renderCard() {
        const deck = decks[currentDeck];
        if (!deck.length) {
            frontKanji.textContent = '—';
            backReading.textContent = '—';
            backMeaning.textContent = 'Kosong';
            frontCounter.textContent = '0 / 0';
            backCounter.textContent = '0 / 0';
            pageInfo.textContent = '0 / 0';
            return;
        }
        const item = deck[currentCard];
        frontKanji.textContent = item.kanji;
        backReading.textContent = item.reading;
        backMeaning.textContent = item.meaning;
        const total = deck.length;
        const idx = currentCard + 1;
        frontCounter.textContent = `${idx} / ${total}`;
        backCounter.textContent = `${idx} / ${total}`;
        backHint.textContent = `#${item.id}`;
        pageInfo.textContent = `${idx} / ${total}`;
        prevBtn.disabled = currentCard === 0;
        nextBtn.disabled = currentCard === total - 1;
        if (isFlipped) flipper.classList.add('flipped');
        else flipper.classList.remove('flipped');
    }

    cardContainer.addEventListener('click', () => {
        if (decks[currentDeck].length === 0) return;
        isFlipped = !isFlipped;
        flipper.classList.toggle('flipped');
    });

    prevBtn.addEventListener('click', () => {
        if (currentCard > 0) { currentCard--; isFlipped = false; flipper.classList.remove('flipped'); renderCard(); }
    });
    nextBtn.addEventListener('click', () => {
        const deck = decks[currentDeck];
        if (currentCard < deck.length - 1) { currentCard++; isFlipped = false; flipper.classList.remove('flipped'); renderCard(); }
    });
    shuffleBtn.addEventListener('click', () => {
        decks[currentDeck] = shuffle(decks[currentDeck]);
        currentCard = 0;
        isFlipped = false;
        flipper.classList.remove('flipped');
        renderCard();
        initQuiz();
    });

    // ═══════════════════════════════════════════════════════════════
    //  QUIZ
    // ═══════════════════════════════════════════════════════════════
    let quizQuestions = [];
    let quizIndex = 0;
    let quizScore = 0;
    let quizAnswered = false;
    let quizTotal = 0;

    function initQuiz() {
        const deck = decks[currentDeck];
        if (deck.length < 2) {
            quizQuestions = [];
            quizIndex = 0;
            quizScore = 0;
            quizTotal = 0;
            renderQuiz();
            return;
        }
        const TARGET = 100;
        let pool = shuffle(deck);
        while (pool.length < TARGET) {
            const extra = shuffle(deck).slice(0, Math.min(TARGET - pool.length, deck.length));
            pool = pool.concat(extra);
        }
        pool = pool.slice(0, TARGET);
        quizQuestions = pool.map(item => {
            const others = deck.filter(d => d.id !== item.id);
            const shuffledOthers = shuffle(others);
            const distractors = shuffledOthers.slice(0, 3);
            const options = shuffle([item, ...distractors]);
            return {
                correct: item,
                options: options,
            };
        });
        quizQuestions = shuffle(quizQuestions);
        quizIndex = 0;
        quizScore = 0;
        quizAnswered = false;
        quizTotal = quizQuestions.length;
        renderQuiz();
    }

    function renderQuiz() {
        if (!quizQuestions.length || quizIndex >= quizQuestions.length) {
            quizBody.innerHTML = `
                <div class="quiz-done">
                    <h3>🎉 Latihan Selesai!</h3>
                    <div class="final-score">${quizScore} / ${quizTotal}</div>
                    <p style="color:#64748b;margin:6px 0 12px;">Jawaban benar dari ${quizTotal} soal</p>
                    <button onclick="initQuiz()">🔄 Ulangi Latihan</button>
                </div>
            `;
            quizProgress.textContent = `Selesai!`;
            quizScoreEl.textContent = `✅ ${quizScore}`;
            return;
        }

        const q = quizQuestions[quizIndex];
        const isK2M = (quizSubMode === 1);

        const prompt = isK2M ? `Arti dari kanji berikut?` : `Kanji yang berarti "${q.correct.meaning}"?`;
        const displayKanji = isK2M ? q.correct.kanji : '';
        const displayReading = isK2M ? q.correct.reading : '';

        let html = `
            <div class="quiz-question" id="quizQuestion">
                ${isK2M ? `<div class="q-kanji">${displayKanji}</div>` : `<div style="font-size:28px;font-weight:600;color:#0f172a;">${q.correct.meaning}</div>`}
                <div class="q-furigana" id="furiganaDisplay"></div>
                <div class="q-prompt">${prompt}</div>
            </div>
            <div class="quiz-options" id="quizOptions">
        `;
        q.options.forEach((opt, idx) => {
            const label = isK2M ? opt.meaning : opt.kanji;
            html += `<button data-idx="${idx}" data-correct="${opt.id === q.correct.id}">${label}</button>`;
        });
        html += `</div>
            <button class="quiz-next-btn" id="quizNextBtn" disabled>Soal Berikutnya →</button>
        `;
        quizBody.innerHTML = html;

        const progress = `${quizIndex + 1} / ${quizTotal}`;
        quizProgress.textContent = `Soal ${progress}`;
        quizScoreEl.textContent = `✅ ${quizScore}`;

        const optionBtns = quizBody.querySelectorAll('#quizOptions button');
        const nextBtnQuiz = document.getElementById('quizNextBtn');
        const furiganaEl = document.getElementById('furiganaDisplay');
        let answered = false;

        optionBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                if (answered) return;
                answered = true;
                const isCorrect = this.dataset.correct === 'true';
                if (isCorrect) {
                    quizScore++;
                    this.classList.add('correct');
                } else {
                    this.classList.add('wrong');
                    optionBtns.forEach(b => {
                        if (b.dataset.correct === 'true') b.classList.add('reveal-correct');
                    });
                }
                optionBtns.forEach(b => b.disabled = true);
                quizScoreEl.textContent = `✅ ${quizScore}`;
                nextBtnQuiz.disabled = false;

                if (quizSubMode === 1) {
                    furiganaEl.textContent = `📖 ${q.correct.reading}`;
                    furiganaEl.classList.add('show');
                }
            });
        });

        nextBtnQuiz.addEventListener('click', function() {
            if (this.disabled) return;
            quizIndex++;
            quizAnswered = false;
            renderQuiz();
        });

        document.addEventListener('keydown', function handler(e) {
            if (e.key === 'Enter' && !nextBtnQuiz.disabled) {
                nextBtnQuiz.click();
                document.removeEventListener('keydown', handler);
            }
        });
    }

    // ── Sub-mode quiz ──
    quizSubModeContainer.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const sub = parseInt(btn.dataset.sub);
        if (sub === quizSubMode) return;
        quizSubMode = sub;
        document.querySelectorAll('#quizSubMode button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        initQuiz();
    });

    // ── Mode toggle (Flashcard / Quiz) ──
    modeBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            modeBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const mode = this.dataset.mode;
            if (mode === 'flashcard') {
                flashcardSection.style.display = 'block';
                quizSection.style.display = 'none';
                renderCard();
            } else {
                flashcardSection.style.display = 'none';
                quizSection.style.display = 'block';
                initQuiz();
            }
        });
    });

    // ═══════════════════════════════════════════════════════════════
    //  START
    // ═══════════════════════════════════════════════════════════════
    renderDeckPicker();
    // Tampilkan deck picker di awal
    showDeckPicker();
    console.log(`✅ Loaded ${allData.length} kanji into ${decks.length} decks (urutan PDF)`);
</script>
</body>
</html>
